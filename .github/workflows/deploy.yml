name: Deploy site

# Deploys only when the code changes (push to main) or when started by hand.
# Data refreshes do NOT redeploy: they go through update-data.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the wallet address is identical in config.json and index.html
        run: |
          node -e '
            const c = require("./config.json").safe.toLowerCase();
            const h = (require("fs").readFileSync("site/index.html","utf8").match(/data-safe="([^"]+)"/)||[])[1]?.toLowerCase();
            if (c !== h) { console.error("MISMATCH config.json=" + c + " index.html=" + h); process.exit(1); }
            console.log("address OK", c);'
      - name: Ship a fresh fallback copy of the data
        run: node scripts/fetch-data.mjs
        env:
          SAFE_API_KEY: ${{ secrets.SAFE_API_KEY }} # optional
      - name: Cache-bust assets
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}-${GITHUB_RUN_ID}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
